name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            ffmpeg \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev
          echo "SONIX_FFMPEG_ROOT=/usr" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/linux:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV

      - name: Build native library (Linux)
        run: dart run tool/build_native_for_distribution.dart --platforms current

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
