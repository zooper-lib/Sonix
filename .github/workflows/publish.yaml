name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          TAG="${GITHUB_REF_NAME}"

          if [ "${TAG}" != "${VERSION}" ] && [ "${TAG}" != "v${VERSION}" ]; then
            echo "Tag (${TAG}) does not match pubspec.yaml version (${VERSION} or v${VERSION})."
            exit 1
          fi

      - name: Validate package
        run: flutter pub publish --dry-run

      - name: Configure pub.dev credentials
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          set -euo pipefail
          test -n "$PUB_CREDENTIALS"
          mkdir -p "$HOME/.config/dart"
          printf '%s' "$PUB_CREDENTIALS" > "$HOME/.config/dart/pub-credentials.json"

      - name: Publish
        run: flutter pub publish --force
